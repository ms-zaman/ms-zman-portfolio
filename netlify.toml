[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # pin the build runtime so a Netlify default bump can't change output
  NODE_VERSION = "22"

# The redesign now lives at / — retire the pre-launch /sky staging route
[[redirects]]
  from = "/sky"
  to = "/"
  status = 301
[[redirects]]
  from = "/sky/*"
  to = "/"
  status = 301

# @astrojs/sitemap emits /sitemap-index.xml, but /sitemap.xml is the URL every
# crawler and scanner actually probes (and the one robots.txt advertised while
# it 404'd). Serve the index at both, as a rewrite so there is no redirect hop.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200

# RFC 9727 fixes this path as extensionless. The real file is kept as .json and
# the well-known path rewritten onto it, so the response is correctly typed even
# from the extension alone — the [[headers]] override below is then belt and
# braces rather than the only thing holding the type up.
#
# (This started as a workaround: `netlify dev` ignores a Content-Type set in
#  [[headers]] and served the extensionless file as application/octet-stream.
#  Production does NOT ignore it — verified live, application/linkset+json — so
#  the rewrite was never strictly required. Kept because it is one less thing
#  depending on header handling. See also the note on /*.md below.)
[[redirects]]
  from = "/.well-known/api-catalog"
  to = "/.well-known/api-catalog.json"
  status = 200

# Markdown content negotiation for agents: rewrites `/` and `/blog/<slug>` to
# their .md twins when the client sends `Accept: text/markdown` (or ?format=md).
# Scoped to these two routes only — the rest of the site never touches the edge
# runtime. Everything else falls through untouched.
[[edge_functions]]
  function = "markdown"
  path = "/"

[[edge_functions]]
  function = "markdown"
  path = "/blog/*"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
    # Agent discovery: point at the llms.txt summary and the RFC 9727 catalog
    # without needing the client to parse the HTML first.
    Link = "</llms.txt>; rel=\"describedby\"; type=\"text/plain\", </.well-known/api-catalog>; rel=\"api-catalog\""

# Cache hashed static assets immutably (Astro emits content-hashed files under /_astro/)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand sky assets (hero poster + cloud cut-outs). A week, not `immutable`:
# these live in public/ so they are NOT content-hashed, and a stale copy pinned
# for a year would survive any future re-export.
[[headers]]
  for = "/sky/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Cache fonts from Google (served through preconnect, but also for any self-hosted)
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static files like robots.txt, sitemap.xml
[[headers]]
  for = "/*.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# The markdown mirrors of the pages (built by src/pages/*.md.ts). Netlify serves
# .md as text/markdown from its own MIME table anyway, so this block is mostly
# about the Cache-Control; the type is declared to make the intent explicit.
#
# ⚠️ Do not conclude from `netlify dev` that a Content-Type set here is ignored.
# Local dev drops it and falls back to the extension; production applies it.
# Verify response headers against the deployed site, not locally.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# The extensionless RFC 9727 path (rewritten to the .json above). Production
# does apply this override — the deployed site returns application/linkset+json,
# which is what RFC 9727 wants rather than a bare application/json.
[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/api-catalog.json"
  [headers.values]
    Content-Type = "application/linkset+json"
    Cache-Control = "public, max-age=3600"
